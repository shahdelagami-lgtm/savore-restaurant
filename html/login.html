<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAVORÉ | Login & Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100 py-5">
        <div class="col-12 col-md-10 col-lg-8">
          <section class="auth-card">
            <div class="auth-header text-center">
              <p class="eyebrow">WELCOME TO</p>
              <h1>SAVORÉ</h1>
              <p class="tagline">Eat together. Stay together.</p>
            </div>

            <div class="row g-0">
              <!-- Login Panel -->
              <div class="col-lg-6 auth-panel">
                <h2>LOGIN</h2>
                <p class="panel-intro">Welcome back to the table.</p>

                <form id="login-form">
                  <div class="mb-3">
                    <label for="login-email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="login-email" name="email" required>
                  </div>

                  <div class="mb-3">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="login-password" name="password" required>
                  </div>

                  <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="remember-me">
                    <label class="form-check-label" for="remember-me">Remember me</label>
                  </div>

                  <button type="submit" class="auth-button w-100">LOGIN</button>
                </form>
              </div>
              <div class="col-lg-6 auth-panel signup-panel" id="signup">
                <h2>SIGN UP</h2>
                <p class="panel-intro">Reserve your place at our table.</p>

                <form id="signup-form">
                  <div class="mb-3">
                    <label for="signup-name" class="form-label">Full name</label>
                    <input type="text" class="form-control" id="signup-name" name="name" required>
                  </div>

                  <div class="mb-3">
                    <label for="signup-email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="signup-email" name="email" required>
                  </div>

                  <div class="mb-4">
                    <label for="signup-password" class="form-label">Create password</label>
                    <input type="password" class="form-control" id="signup-password" name="password" minlength="6" required>
                  </div>

                  <button type="submit" class="auth-button w-100">CREATE ACCOUNT</button>
                </form>
              </div>
            </div>
            <p class="auth-note text-center">
              By continuing, you agree to our terms and privacy policy.
            </p>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById("login-form").addEventListener("submit", function(e) {
        e.preventDefault();
        let email = document.getElementById("login-email").value;
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("username", email ? email.split('@')[0] : "User");
        window.location.href = "index.html";  
    });
</script>
  <script src="../js/script.js"></script>
</body>
</html>
